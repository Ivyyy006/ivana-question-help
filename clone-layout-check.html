<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clone tooltip layout check</title><style>body{margin:0;background:#f0f2ed;color:#303849;font:14px system-ui,sans-serif}header{padding:12px 18px;border-bottom:1px solid #a7bbab;background:white;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{font:inherit;padding:8px 14px;cursor:pointer;border:1px solid #a7bbab;border-radius:7px;background:#e5eae2;color:#244536}button[aria-pressed=true]{background:#244536;color:white}main{padding:16px;display:flex;justify-content:center;overflow:auto}iframe{display:block;width:375px;height:800px;border:1px solid #a7bbab;background:white;flex:none}</style></head>
<body><header><strong>Clone tooltip layout check</strong><button type="button" data-width="375" aria-pressed="true">375px</button><button type="button" data-width="390" aria-pressed="false">390px</button><button type="button" data-width="430" aria-pressed="false">430px</button><span id="viewport-label">375px viewport</span></header><main><iframe id="clone-under-test" title="Test clone" src="https://form.jotform.com/263031945610148"></iframe></main><script>const frame=document.getElementById('clone-under-test');document.querySelectorAll('[data-width]').forEach(button=>button.addEventListener('click',()=>{frame.style.width=button.dataset.width+'px';document.getElementById('viewport-label').textContent=button.dataset.width+'px viewport';document.querySelectorAll('[data-width]').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));}));</script></body></html>
