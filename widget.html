<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Ivana Dipp | Question Help</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caudex:wght@400;700&display=swap">
  <link rel="stylesheet" href="tooltip.css">
  <link rel="stylesheet" href="widget.css">
  <script defer src="https://js.jotform.com/JotFormCustomWidget.min.js"></script>
  <script defer src="widget.js"></script>
</head>
<body>
  <main id="help-widget" aria-label="Question help">
    <div id="help-panel" class="ivana-tooltip-panel" role="region" aria-label="Helper text" hidden></div>
    <div class="widget-trigger-row">
      <button id="help-button" class="ivana-tooltip-button" type="button" aria-label="Open question help" aria-controls="help-panel" aria-expanded="false" disabled>
        <span class="ivana-tooltip-icon" aria-hidden="true">?</span>
      </button>
    </div>
    <p id="help-status" role="status">Waiting for Jotform helper text.</p>
  </main>
</body>
</html>
